name: Docker

# Builds and pushes a multi-arch (amd64 + arm64) Linux Docker image to
# both the GitHub Container Registry (GHCR) and Docker Hub.
#
# - On every push/PR to main: builds and pushes :main tag
# - On v* tags: also tags :latest, :<version>, :<version>-9M2PJU
#
# FreeBSD has no native GitHub Actions runner, so the FreeBSD image
# (Dockerfile.freebsd) is NOT built in CI. FreeBSD users build it
# locally via tools/install-docker.sh (which calls podman build).
#
# The image is built from source on debian:12-slim, so it works on any
# Linux host with Docker (or Podman on Linux). QEMU emulation is used
# for arm64 builds on the amd64 GitHub runner.

on:
  push:
    branches: [ main ]
    tags:    [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # required to push to GHCR

env:
  # GHCR requires lowercase repository names. github.repository_owner
  # preserves the case of the GitHub username (9M2PJU), so we lowercase
  # it here to get 9m2pju.
  IMAGE_GHCR: ghcr.io/9m2pju/aprsc
  IMAGE_DOCKERHUB: docker.io/9m2pju/aprsc

jobs:
  build:
    name: build and push
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -e
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VER="$(cat src/VERSION | tr -d '[:space:]')"
            TAGS="${{ env.IMAGE_GHCR }}:latest,${{ env.IMAGE_GHCR }}:${VER},${{ env.IMAGE_GHCR }}:${VER}-9M2PJU"
            TAGS="$TAGS,${{ env.IMAGE_DOCKERHUB }}:latest,${{ env.IMAGE_DOCKERHUB }}:${VER},${{ env.IMAGE_DOCKERHUB }}:${VER}-9M2PJU"
          else
            TAGS="${{ env.IMAGE_GHCR }}:main,${{ env.IMAGE_DOCKERHUB }}:main"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false

      - name: Build (PR, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          load: false
